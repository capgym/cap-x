# Usage (on 4090w, with official Tron2_controller running in develop mode on port 5000):
#   Oracle visual verification:
#     MUJOCO_GL=egl PYTHONPATH=. uv run --no-sync python capx/envs/launch.py \
#       --config-path env_configs/tron2/tron2_cube_lift_visual.yaml \
#       --use-oracle-code True --total-trials 1
#
#   LLM agent run (e.g. Qwen2.5-Coder-7B-Instruct):
#     MUJOCO_GL=egl PYTHONPATH=. uv run --no-sync python capx/envs/launch.py \
#       --config-path env_configs/tron2/tron2_cube_lift_visual.yaml \
#       --use-oracle-code False \
#       --server-url http://127.0.0.1:18089/v1/chat/completions \
#       --model checkpoints/Qwen2.5-Coder-7B-Instruct \
#       --total-trials 1 --num-workers 1

env:
  _target_: capx.envs.tasks.tron2.tron2_cube_lift_visual.Tron2CubeLiftVisualCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: tron2_cube_lift_low_level
    privileged: false
    enable_render: true
    apis:
      - Tron2ControlApi

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/tron2_cube_lift_visual

trials: 1
num_workers: 1
