# Non-oracle RoboSuite NutAssemblySingle evaluation.
env:
  _target_: capx.envs.tasks.franka.franka_nut_assembly.FrankaNutAssemblySingleCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_nut_assembly_single_low_level
    privileged: true
    apis:
      - FrankaControlNutAssemblyPrivilegedApi

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/franka_robosuite_nut_assembly_single_privileged
use_oracle_code: false
trials: 100
num_workers: 4
